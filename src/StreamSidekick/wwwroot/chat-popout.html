<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Chat · John's Twitch Handler</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; grid-template-rows: auto 1fr; height: 100vh; margin: 0; overflow: hidden; background: #0e1118; color: #f5f7fb; }
    header { display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 6px 9px; border-bottom: 1px solid #2a3040; background: #11141c; font-size: 11px; }
    header strong { margin-right: auto; }
    label { display: flex; align-items: center; gap: 5px; color: #9aa3b5; }
    input { width: 72px; accent-color: #9867ff; }
    .chats { display: grid; min-height: 0; gap: 1px; background: #2a3040; }
    section { display: grid; grid-template-rows: 22px minmax(0, 1fr); min-height: 0; background: #0e1118; }
    section span { display: flex; align-items: center; padding: 0 7px; color: #9aa3b5; font-size: 9px; letter-spacing: .08em; }
    iframe { width: 100%; height: 100%; border: 0; opacity: var(--chat-opacity, 1); }
  </style>
</head>
<body>
  <header>
    <strong id="title">Game Chat</strong>
    <label>Opacity <input id="opacity" type="range" min="45" max="100" value="92"></label>
  </header>
  <div id="chats" class="chats"></div>
  <script>
    // This conventional popup is the fallback when Document Picture-in-Picture is unavailable.
    const channel = new URLSearchParams(location.search).get("channel") || "";
    const youtube = new URLSearchParams(location.search).get("youtube") || "";
    const frames = [];
    // Use the Handler's messages-only feed instead of Twitch's embedded room. Twitch owns the
    // embedded room's leaderboard/promotional panels, which cannot be hidden across an iframe.
    if (channel) frames.push('<section><span>TWITCH</span><iframe title="Twitch game chat" src="/chat-overlay.html?limit=20"></iframe></section>');
    if (youtube) frames.push(`<section><span>YOUTUBE</span><iframe title="YouTube game chat" src="https://www.youtube.com/live_chat?v=${encodeURIComponent(youtube)}&embed_domain=${encodeURIComponent(location.hostname)}&dark_theme=1"></iframe></section>`);
    document.querySelector("#title").textContent = frames.length > 1 ? "Twitch + YouTube chat" : channel ? `${channel} chat` : "YouTube chat";
    document.querySelector("#chats").style.gridTemplateRows = `repeat(${Math.max(1, frames.length)}, minmax(0, 1fr))`;
    document.querySelector("#chats").innerHTML = frames.join("");
    document.querySelector("#opacity").addEventListener("input", event => {
      document.documentElement.style.setProperty("--chat-opacity", String(Number(event.target.value) / 100));
    });
  </script>
</body>
</html>
